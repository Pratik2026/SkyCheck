services:
  - type: web
    name: weather-chatbot
    runtime: python
    region: singapore
    plan: free
    buildCommand: |
      # Install Python dependencies
      pip install --upgrade pip
      pip install -r requirements.txt
      
      # Install Node.js and build React app
      cd frontend
      npm install
      npm run build
      cd ..
      
      # Move React build to static directory for FastAPI
      mkdir -p static
      cp -r frontend/dist/* static/
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: NODE_VERSION  
        value: "18.x"
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "gemini/gemini-2.0-flash"